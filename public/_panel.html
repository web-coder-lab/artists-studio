<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
  <meta name="description" content="Artist's Studio — photography, direction, and private conversation. Portfolio, reels, and a direct line to the studio."/>
  <meta name="robots" content="index,follow"/>
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="Artist's Studio"/>
  <meta property="og:title" content="Artist's Studio"/>
  <meta property="og:description" content="A quiet space for work that holds attention. Portfolio, reels, and private contact."/>
  <meta property="og:url" content="https://artists-studio.onrender.com/"/>
  <meta property="og:image" content="https://artists-studio.onrender.com/og.png"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Artist's Studio"/>
  <meta name="twitter:description" content="Photography · Direction · Craft"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>

  <title>Admin — Artist's Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/studio.css"/>
  <link rel="stylesheet" href="/css/chat.css"/>
  <style>
    .admin-wrap{max-width:1000px;margin:0 auto;padding:8px 8px 88px}
    #panel-chat .chat-app{height:calc(100vh - 160px);max-width:100%;border-radius:12px}
    .tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
    .tabs button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 12px;font:inherit;cursor:pointer;font-size:.82rem}
    .tabs button.active{color:var(--text);border-color:var(--accent);background:var(--accent-dim)}
    .panel{display:none}.panel.active{display:block}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:12px 0}
    .stat{background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;padding:14px}
    .stat b{display:block;font-size:1.4rem;font-family:var(--font-display);font-weight:500}
    .stat span{font-size:.78rem;color:var(--muted)}
    .form-grid{display:flex;flex-direction:column;gap:10px;max-width:520px}
    .form-grid label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
    .form-grid input,.form-grid textarea,.form-grid select{
      font:inherit;color:var(--text);background:var(--bg-elev);border:1px solid var(--line);
      border-radius:10px;padding:10px 12px}
    .list-row{display:flex;justify-content:space-between;gap:10px;align-items:center;
      padding:12px;border-bottom:1px solid var(--line);font-size:.92rem}
    .bottom-nav{
      position:fixed;bottom:0;left:0;right:0;z-index:30;
      display:flex;justify-content:space-around;padding:10px 6px calc(10px + env(safe-area-inset-bottom));
      background:rgba(10,10,11,.94);border-top:1px solid var(--line);backdrop-filter:blur(10px)
    }
    .bottom-nav button{background:none;border:none;color:var(--muted);font:inherit;font-size:.72rem;cursor:pointer}
    .bottom-nav button.active{color:var(--accent)}
    .login-box{max-width:360px}
  </style>
  <script>
    (function(){
      try {
        var t = localStorage.getItem('as_token');
        if (!t) document.documentElement.classList.add('needs-auth');
      } catch(e) { document.documentElement.classList.add('needs-auth'); }
    })();
  </script>
  <style>
    html.needs-auth body > main,
    html.needs-auth body > .reels-shell,
    html.needs-auth .home-grid { visibility: hidden !important; }
  </style>
</head>
<body>
  <div class="grain"></div>
  <header class="nav">
    <a class="brand" href="/">Artist's Studio</a>
    <nav class="nav-actions"><span class="muted" id="who">Admin</span></nav>
  </header>
  <div class="admin-wrap">
    <div id="loginGate" class="login-box">
      <h1 style="font-family:var(--font-display);font-weight:500">Admin</h1>
      <p class="muted">Remote control center</p>
      <form id="adminLogin" class="form">
        <label><span>Username</span><input name="username" required value="admin"/></label>
        <label><span>Password</span><input name="password" type="password" required/></label>
        <p class="form-error hidden" id="loginErr"></p>
        <button class="btn btn-block" type="submit">Sign in</button>
      </form>
    </div>

    <div id="adminApp" class="hidden">
      <h1 style="font-family:var(--font-display);font-weight:500;font-size:1.7rem;margin:0 0 4px">Control</h1>
      <p class="muted" id="dashHint" style="margin-top:0">Remote site + inbox</p>

      <div class="tabs" id="topTabs">
        <button type="button" class="active" data-panel="home">Home</button>
        <button type="button" data-panel="chat">Chat</button>
        <button type="button" data-panel="contact">Contact</button>
        <button type="button" data-panel="site">Site</button>
        <button type="button" data-panel="socials">Socials</button>
        <button type="button" data-panel="portfolio">Portfolio</button>
        <button type="button" data-panel="reels">Reels</button>
        <button type="button" data-panel="users">Users</button>
        <button type="button" data-panel="versions">Publish</button>
        <button type="button" data-panel="security">Security</button>
      </div>

      <section class="panel active" id="panel-home">
        <div class="stat-grid" id="stats"></div>
        <button type="button" class="btn" id="btnPublishQuick">Publish now</button>
      </section>

      <section class="panel" id="panel-chat">
        <div class="chat-app admin full" id="adminChat">
          <div class="chat-layout" style="flex:1;min-height:0;display:flex">
            <div class="chat-sidebar" id="convList"></div>
            <div class="chat-thread-wrap" id="threadPane">
              <div class="chat-empty" id="threadEmpty">Select a conversation</div>
              <div class="hidden" id="threadActive" style="display:flex;flex-direction:column;flex:1;min-height:0">
                <div class="chat-header">
                  <button type="button" class="back" id="backList">←</button>
                  <div>
                    <h1 id="thName">—</h1>
                    <p class="sub" id="thSub"></p>
                  </div>
                </div>
                <div class="chat-thread" id="thread"></div>
                <form class="chat-compose" id="compose">
                  <label class="attach-btn">+
                    <input type="file" name="file" id="fileInputAdmin" accept="image/*,video/mp4,video/webm,.pdf,.doc,.docx,.txt"/>
                  </label>
                  <span class="file-chip hidden" id="fileChipAdmin"></span>
                  <textarea name="body" rows="1" placeholder="Reply…"></textarea>
                  <button type="submit">Send</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-contact">
        <p class="muted" id="contactMeta">Form submissions</p>
        <div id="contactList"></div>
        <div id="contactDetail" class="hidden" style="margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--bg-soft)"></div>
      </section>

      <section class="panel" id="panel-site">
        <form class="form-grid" id="siteForm">
          <label>Brand<input name="brand"/></label>
          <label>Tagline<input name="tagline"/></label>
          <label>Hero title<input name="hero_title"/></label>
          <label>Hero subtitle<textarea name="hero_subtitle" rows="3"></textarea></label>
          <label>Profile name<input name="profile_name"/></label>
          <label>Profile role<input name="profile_role"/></label>
          <label>Profile bio<textarea name="profile_bio" rows="3"></textarea></label>
          <label>About<textarea name="about" rows="4"></textarea></label>
          <label>Accent color<input name="accent" placeholder="#c4a574"/></label>
          <button class="btn" type="submit">Save site</button>
          <p class="muted" id="siteMsg"></p>
        </form>
      </section>

      <section class="panel" id="panel-socials">
        <form class="form-grid" id="socialsForm">
          <label>WhatsApp (digits)<input name="whatsapp"/></label>
          <label>Email<input name="email" type="email"/></label>
          <label>Instagram URL<input name="instagram"/></label>
          <label>YouTube URL<input name="youtube"/></label>
          <button class="btn" type="submit">Save socials</button>
          <p class="muted" id="socialsMsg"></p>
        </form>
      </section>

      <section class="panel" id="panel-portfolio">
        <form class="form-grid" id="folioAdd">
          <label>Title<input name="title" required/></label>
          <label>Category<input name="category"/></label>
          <label>Photo from gallery<input name="file" type="file" accept="image/*" required/></label>
          <label>Caption<input name="caption"/></label>
          <button class="btn" type="submit">Upload to portfolio</button>
        </form>
        <div id="folioList" style="margin-top:16px"></div>
      </section>

      <section class="panel" id="panel-reels">
        <form class="form-grid" id="reelAdd">
          <label>Title<input name="title" required/></label>
          <label>Video/Image from gallery<input name="file" type="file" accept="image/*,video/mp4,video/webm" required/></label>
          <button class="btn" type="submit">Upload reel</button>
        </form>
        <div id="reelList" style="margin-top:16px"></div>
      </section>

      <section class="panel" id="panel-users">
        <div id="userList"></div>
      </section>

      <section class="panel" id="panel-security">
        <div class="stat-grid" id="secStats"></div>
        <p class="muted" id="secIp"></p>
        <button type="button" class="btn btn-ghost" id="btnRevokeAll">Revoke all sessions</button>
        <h3 style="margin-top:18px;font-family:var(--font-display);font-weight:500">Recent events</h3>
        <div id="secAudit"></div>
        <h3 style="margin-top:18px;font-family:var(--font-display);font-weight:500">Sessions</h3>
        <div id="secSessions"></div>
      </section>
      <section class="panel" id="panel-versions">
        <p class="muted" id="verMeta"></p>
        <button type="button" class="btn" id="btnPublish">Publish snapshot</button>
        <div id="verList" style="margin-top:14px"></div>
      </section>
    </div>
  </div>

  <nav class="bottom-nav hidden" id="bottomNav">
    <button type="button" data-panel="home" class="active">Home</button>
    <button type="button" data-panel="chat">Inbox</button>
    <button type="button" data-panel="site">Builder</button>
    <button type="button" data-panel="portfolio">Media</button>
    <button type="button" data-panel="versions">More</button>
  </nav>

  <script src="/js/api-client.js"></script>
  <script src="/js/webrtc-call.js"></script>
  <script src="/js/admin-app.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const host = document.querySelector('[data-panel="security"], #security, .security-panel') || document.body;
  if (document.getElementById('btnBackup')) return;
  const bar = document.createElement('div');
  bar.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;padding:12px;';
  bar.innerHTML = '<button type="button" class="btn btn-sm" id="btnBackup">Download backup</button>' +
    '<button type="button" class="btn btn-sm btn-ghost" id="btnPw">Change password</button>';
  (document.querySelector('main') || document.body).appendChild(bar);
  document.getElementById('btnBackup').onclick = () => window.downloadBackup && downloadBackup();
  document.getElementById('btnPw').onclick = () => window.changeAdminPassword && changeAdminPassword();
});
</script>
</body>
</html>
