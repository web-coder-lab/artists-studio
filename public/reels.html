<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#000"/>
  <title>Reels — Artist's Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/studio.css"/>
  <style>
    body.reels-mode{background:#000;overflow:hidden;margin:0}
    .reels-shell{position:fixed;inset:0;top:56px;background:#000}
    .reels-feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
    .reel-slide{
      height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;
      display:flex;align-items:center;justify-content:center;background:#050505;
    }
    .reel-slide video,.reel-slide img{
      width:100%;height:100%;object-fit:cover;background:#000;
      animation:reelIn .45s ease;
    }
    @keyframes reelIn{from{opacity:.4;transform:scale(1.03)}to{opacity:1;transform:scale(1)}}
    .reel-grad{position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 40%,rgba(0,0,0,.25) 100%)}
    .reel-actions{
      position:absolute;right:12px;bottom:110px;z-index:5;
      display:flex;flex-direction:column;gap:18px;align-items:center;
    }
    .reel-actions button{
      width:48px;height:48px;border-radius:50%;border:none;
      background:rgba(0,0,0,.4);backdrop-filter:blur(8px);color:#fff;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:transform .15s;
    }
    .reel-actions button:active{transform:scale(.92)}
    .reel-actions button svg{width:22px;height:22px;fill:currentColor}
    .reel-actions button.liked{color:#ff3b5c}
    .reel-actions span{font-size:.7rem;color:#eee;margin-top:-10px;font-weight:500}
    .reel-meta{position:absolute;left:16px;right:72px;bottom:36px;z-index:5;color:#fff}
    .reel-meta h2{margin:0 0 6px;font-size:1rem;font-weight:600;text-shadow:0 2px 8px #000}
    .empty-reels,.reel-loader{
      color:#9c978c;text-align:center;padding:80px 24px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;
    }
    .spinner{
      width:36px;height:36px;border:2px solid rgba(255,255,255,.15);
      border-top-color:#c4a574;border-radius:50%;animation:spin .7s linear infinite;margin-bottom:14px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .comment-sheet{
      position:fixed;left:0;right:0;bottom:0;max-height:55%;z-index:40;
      background:#121214;border-radius:18px 18px 0 0;padding:16px;
      display:none;flex-direction:column;box-shadow:0 -12px 40px rgba(0,0,0,.5);
      animation:sheetUp .25s ease;
    }
    .comment-sheet.open{display:flex}
    @keyframes sheetUp{from{transform:translateY(30%)}to{transform:translateY(0)}}
    .comment-list{flex:1;overflow:auto;margin:10px 0}
    .comment-list p{margin:0 0 12px;font-size:.9rem;color:#f4f1ea}
    .comment-list .u{color:#c4a574;font-size:.75rem}
    .comment-form{display:flex;gap:8px}
    .comment-form input{
      flex:1;border-radius:12px;border:1px solid rgba(255,255,255,.1);
      background:#0a0a0b;color:#fff;padding:12px;font:inherit;
    }
    .offline-chip{
      position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:50;
      background:#1a1210;border:1px solid rgba(224,122,106,.45);color:#f4f1ea;
      padding:8px 14px;border-radius:999px;font-size:.8rem;
    }
    .offline-chip.hidden{display:none}
  </style>
</head>
<body class="reels-mode" data-page="reels">
  <div id="site-nav"></div>
  <div class="offline-chip hidden" id="offlineChip">You're offline</div>
  <div class="reels-shell">
    <div class="reels-feed" id="feed">
      <div class="reel-loader"><div class="spinner"></div><p>Loading reels…</p></div>
    </div>
  </div>
  <div class="comment-sheet" id="comments">
    <strong style="color:#fff">Comments</strong>
    <div class="comment-list" id="commentList"></div>
    <form class="comment-form" id="commentForm">
      <input name="body" placeholder="Add a comment…" autocomplete="off" required/>
      <button class="btn btn-sm" type="submit">Post</button>
    </form>
    <button type="button" class="btn btn-ghost btn-sm" id="closeComments" style="margin-top:10px">Close</button>
  </div>
  <div id="site-modals"></div>
  <script src="/js/api-client.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/reels-feed.js"></script>
</body>
</html>
