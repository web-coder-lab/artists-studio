<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="description" content="Reels — Artist's Studio"/>
  <title>Reels — Artist's Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --gold: #d4b483;
      --gold-2: #e8d5b5;
      --hot: #ff2d55;
      --glass: rgba(15,15,17,.55);
      --line: rgba(255,255,255,.14);
      --ease: cubic-bezier(.22,1,.36,1);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: #000; color: #fff;
      font-family: "DM Sans", system-ui, sans-serif;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; padding: 0; }

    /* Icons: stroke style */
    .ico { width: 22px; height: 22px; stroke: currentColor; fill: none;
      stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; display: block; }
    .ico-fill { fill: currentColor; stroke: none; }
    .ico-sm { width: 18px; height: 18px; }

    /* Top */
    .top {
      position: fixed; inset: 0 0 auto 0; z-index: 40;
      height: calc(52px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 14px 0;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(180deg, rgba(0,0,0,.7), transparent);
      pointer-events: none;
    }
    .top > * { pointer-events: auto; }
    .brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.2rem; font-weight: 500; letter-spacing: .02em;
    }
    .brand em { font-style: normal; color: var(--gold); }
    .top-btns { display: flex; gap: 8px; }
    .chip-btn {
      width: 40px; height: 40px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--glass);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      display: grid; place-items: center;
      transition: transform .15s var(--ease), border-color .2s, color .2s;
    }
    .chip-btn:active { transform: scale(.94); }
    .chip-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* Feed */
    .shell { position: fixed; inset: 0; background: #000; }
    .feed {
      height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
      scrollbar-width: none;
    }
    .feed::-webkit-scrollbar { display: none; }

    .slide {
      position: relative; height: 100%; width: 100%;
      scroll-snap-align: start; scroll-snap-stop: always;
      background: #050505; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .slide video, .slide img {
      width: 100%; height: 100%; object-fit: cover;
      animation: fadeIn .45s var(--ease);
    }
    @keyframes fadeIn {
      from { opacity: .3; transform: scale(1.03); }
      to { opacity: 1; transform: scale(1); }
    }
    .veil {
      position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(0deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.35) 26%, transparent 45%),
        linear-gradient(180deg, rgba(0,0,0,.55) 0%, transparent 16%);
    }

    /* Right rail */
    .rail {
      position: absolute; right: 10px; z-index: 6;
      bottom: max(110px, calc(16% + env(safe-area-inset-bottom)));
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    .rail-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .rail-btn {
      width: 50px; height: 50px; border-radius: 50%;
      border: 1px solid var(--line); background: var(--glass);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      display: grid; place-items: center;
      box-shadow: 0 10px 28px rgba(0,0,0,.4);
      transition: transform .15s var(--ease), background .2s, color .2s, border-color .2s;
    }
    .rail-btn:active { transform: scale(.9); }
    .rail-btn.liked { color: var(--hot); border-color: rgba(255,45,85,.45); background: rgba(255,45,85,.16); }
    .rail-btn.liked .ico { fill: currentColor; stroke: currentColor; }
    .rail-btn.saved { color: var(--gold); border-color: rgba(212,180,131,.4); background: rgba(212,180,131,.14); }
    .rail-btn.saved .ico { fill: currentColor; stroke: currentColor; }
    .rail-count {
      font-size: .68rem; font-weight: 600;
      color: rgba(255,255,255,.92);
      text-shadow: 0 1px 6px #000;
      min-height: 14px;
    }

    /* Meta */
    .meta {
      position: absolute; left: 16px; right: 72px; z-index: 6;
      bottom: max(24px, env(safe-area-inset-bottom));
      padding-bottom: 6px;
    }
    .who {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #8a6a3a);
      color: #1a140c; font-family: "Cormorant Garamond", serif;
      font-weight: 600; font-size: 1rem;
      display: grid; place-items: center;
      border: 1.5px solid rgba(255,255,255,.4);
      box-shadow: 0 4px 16px rgba(0,0,0,.35);
    }
    .who strong { font-size: .9rem; font-weight: 600; }
    .meta h2 {
      margin: 0 0 6px; font-size: 1.05rem; font-weight: 600;
      line-height: 1.3; text-shadow: 0 2px 14px rgba(0,0,0,.85);
    }
    .meta p {
      margin: 0; font-size: .86rem; line-height: 1.45;
      color: rgba(255,255,255,.9); text-shadow: 0 1px 10px rgba(0,0,0,.75);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden; max-width: 94%;
    }
    .tag {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 10px; font-size: .65rem; font-weight: 700;
      letter-spacing: .16em; text-transform: uppercase; color: var(--gold);
    }
    .tag::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold); box-shadow: 0 0 10px var(--gold);
    }

    /* Mute badge */
    .mute-pill {
      position: absolute; top: calc(64px + env(safe-area-inset-top)); left: 50%;
      transform: translateX(-50%);
      z-index: 7; pointer-events: none;
      display: none; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 999px;
      background: rgba(0,0,0,.55); border: 1px solid var(--line);
      backdrop-filter: blur(10px); font-size: .75rem; font-weight: 500;
    }
    .mute-pill.show { display: inline-flex; animation: pill .25s var(--ease); }
    @keyframes pill { from { opacity: 0; transform: translateX(-50%) translateY(-6px); } to { opacity: 1; transform: translateX(-50%); } }

    /* Heart */
    .burst {
      position: absolute; left: 50%; top: 42%; z-index: 15; pointer-events: none;
      transform: translate(-50%, -50%) scale(0); opacity: 0;
      color: var(--hot); filter: drop-shadow(0 8px 24px rgba(0,0,0,.5));
    }
    .burst svg { width: 96px; height: 96px; fill: currentColor; stroke: none; }
    .burst.pop { animation: burst .7s var(--ease) forwards; }
    @keyframes burst {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); }
      40% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -58%) scale(1); }
    }

    /* Loader / empty */
    .state {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      text-align: center; padding: 40px 28px; color: #9c978c;
    }
    .spin {
      width: 42px; height: 42px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.12); border-top-color: var(--gold);
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state h3 {
      margin: 0; font-family: "Cormorant Garamond", serif;
      font-size: 1.7rem; font-weight: 500; color: #f5f1ea;
    }
    .state p { margin: 0; max-width: 260px; line-height: 1.55; font-size: .9rem; }
    .state a {
      margin-top: 6px; padding: 12px 22px; border-radius: 999px;
      background: linear-gradient(145deg, var(--gold), #b8956a);
      color: #14110d; font-weight: 600; font-size: .85rem;
    }

    /* Side menu */
    .scrim {
      position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.55);
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    .scrim.on { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 60;
      width: min(300px, 86vw);
      background: #0e0e10; border-left: 1px solid var(--line);
      transform: translateX(105%); transition: transform .35s var(--ease);
      padding: calc(16px + env(safe-area-inset-top)) 18px 24px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .drawer.on { transform: translateX(0); }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .drawer-head strong {
      font-family: "Cormorant Garamond", serif; font-size: 1.25rem; font-weight: 500;
    }
    .nav-link {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 12px; border-radius: 14px;
      color: rgba(255,255,255,.85); font-size: .95rem; font-weight: 500;
      transition: background .2s, color .2s;
    }
    .nav-link:hover, .nav-link.on { background: rgba(212,180,131,.12); color: var(--gold); }
    .nav-link .ico { opacity: .9; }
    .drawer-foot {
      margin-top: auto; font-size: .75rem; color: #6b675f; line-height: 1.5;
      padding-top: 16px; border-top: 1px solid var(--line);
    }

    /* Comments */
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
      max-height: 58vh; background: #121214;
      border-radius: 22px 22px 0 0; border-top: 1px solid var(--line);
      transform: translateY(110%); transition: transform .35s var(--ease);
      display: flex; flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sheet.on { transform: translateY(0); }
    .sheet-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--line);
    }
    .sheet-head h3 { margin: 0; font-size: .95rem; font-weight: 600; }
    .sheet-list { flex: 1; overflow-y: auto; padding: 12px 18px; font-size: .88rem; }
    .sheet-list .u { color: var(--gold); font-weight: 600; font-size: .8rem; }
    .sheet-list p { margin: 0 0 12px; color: #ddd; line-height: 1.45; }
    .sheet-form {
      display: flex; gap: 8px; padding: 12px 16px;
      border-top: 1px solid var(--line);
    }
    .sheet-form input {
      flex: 1; border-radius: 999px; border: 1px solid var(--line);
      background: #1a1a1c; color: #fff; padding: 12px 16px; font-size: .9rem; outline: none;
    }
    .sheet-form input:focus { border-color: var(--gold); }
    .sheet-form button {
      border-radius: 999px; padding: 0 18px;
      background: var(--gold); color: #14110d; font-weight: 600;
    }

    @media (min-width: 900px) {
      .shell, .top, .scrim, .drawer, .sheet {
        max-width: 420px; left: 50%; right: auto; margin: 0;
        transform: translateX(-50%);
      }
      .shell { border-left: 1px solid #1a1a1a; border-right: 1px solid #1a1a1a; }
      .drawer { transform: translateX(calc(-50% + 210px + 105%)); right: auto; left: 50%; }
      .drawer.on { transform: translateX(calc(-50% + 210px)); }
      .top { transform: translateX(-50%); }
      .sheet { transform: translate(-50%, 110%); }
      .sheet.on { transform: translate(-50%, 0); }
    }
  </style>
</head>
<body data-page="reels">
  <!-- Top -->
  <header class="top">
    <a class="brand" href="/">Artist's <em>Studio</em></a>
    <div class="top-btns">
      <a class="chip-btn" href="/portfolio.html" title="Portfolio" aria-label="Portfolio">
        <svg class="ico ico-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </a>
      <button class="chip-btn" type="button" id="menuBtn" aria-label="Menu" aria-expanded="false">
        <svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <strong>Navigate</strong>
      <button class="chip-btn" type="button" id="menuClose" aria-label="Close">
        <svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <a class="nav-link" href="/">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg>
      Home
    </a>
    <a class="nav-link" href="/about.html">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 19.5c1.2-3.2 3.7-4.8 7-4.8s5.8 1.6 7 4.8"/></svg>
      About
    </a>
    <a class="nav-link" href="/portfolio.html">
      <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Portfolio
    </a>
    <a class="nav-link on" href="/reels.html">
      <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="m10 8 6 4-6 4V8z"/></svg>
      Reels
    </a>
    <a class="nav-link" href="/contact.html">
      <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 8 8 6 8-6"/></svg>
      Contact
    </a>
    <div class="drawer-foot">Swipe up · next reel<br/>Double-tap · like · Tap · mute</div>
  </aside>

  <div class="shell">
    <div class="feed" id="feed">
      <div class="state"><div class="spin"></div><p>Loading reels…</p></div>
    </div>
  </div>

  <div class="sheet" id="comments">
    <div class="sheet-head">
      <h3>Comments</h3>
      <button type="button" id="closeComments" aria-label="Close">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-list" id="commentList"></div>
    <form class="sheet-form" id="commentForm">
      <input name="body" placeholder="Add a comment…" maxlength="500" autocomplete="off"/>
      <button type="submit">Post</button>
    </form>
  </div>

  <script>
    (function () {
      const btn = document.getElementById('menuBtn');
      const close = document.getElementById('menuClose');
      const drawer = document.getElementById('drawer');
      const scrim = document.getElementById('scrim');
      function setOpen(open) {
        drawer.classList.toggle('on', open);
        scrim.classList.toggle('on', open);
        drawer.setAttribute('aria-hidden', open ? 'false' : 'true');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      btn.addEventListener('click', () => setOpen(!drawer.classList.contains('on')));
      close.addEventListener('click', () => setOpen(false));
      scrim.addEventListener('click', () => setOpen(false));
      drawer.querySelectorAll('a').forEach((a) => a.addEventListener('click', () => setOpen(false)));
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
    })();
  </script>
  <script src="/js/api-client.js"></script>
  <script src="/js/reels-feed.js"></script>
</body>
</html>
