<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="description" content="Reels — Artist's Studio vertical work"/>
  <title>Reels — Artist's Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --accent: #d4b483;
      --accent-2: #e8d5b5;
      --accent-hot: #ff3b6b;
      --glass: rgba(12,12,14,.62);
      --line: rgba(255,255,255,.14);
      --ease: cubic-bezier(.22,1,.36,1);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: #000; color: #fff;
      font-family: "DM Sans", system-ui, sans-serif;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* ——— Top bar ——— */
    .r-top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      padding: env(safe-area-inset-top) 14px 0;
      height: calc(56px + env(safe-area-inset-top));
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,.75) 0%, transparent 100%);
      pointer-events: none;
    }
    .r-top > * { pointer-events: auto; }
    .r-brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.2rem; font-weight: 500; letter-spacing: .02em;
      color: #fff;
    }
    .r-brand span { color: var(--accent); }
    .r-top-actions { display: flex; gap: 8px; align-items: center; }
    .r-icon-btn {
      width: 42px; height: 42px; border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--glass);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      color: #fff; display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform .15s, border-color .2s, background .2s;
    }
    .r-icon-btn:active { transform: scale(.94); }
    .r-icon-btn:hover, .r-icon-btn[aria-expanded="true"] {
      border-color: var(--accent); color: var(--accent);
    }
    .r-icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* ——— Side menu ——— */
    .r-scrim {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
      opacity: 0; pointer-events: none; transition: opacity .3s var(--ease);
    }
    .r-scrim.open { opacity: 1; pointer-events: auto; }
    .r-menu {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 70;
      width: min(320px, 86vw);
      background: #0e0e10;
      border-left: 1px solid var(--line);
      transform: translateX(105%);
      transition: transform .38s var(--ease);
      display: flex; flex-direction: column;
      padding: calc(16px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));
      box-shadow: -20px 0 60px rgba(0,0,0,.5);
    }
    .r-menu.open { transform: translateX(0); }
    .r-menu-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px;
    }
    .r-menu-head strong {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.35rem; font-weight: 500;
    }
    .r-menu-head strong span { color: var(--accent); }
    .r-menu nav { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .r-menu a {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-radius: 16px;
      color: rgba(255,255,255,.78); font-size: .95rem; font-weight: 500;
      transition: background .2s, color .2s;
    }
    .r-menu a:hover, .r-menu a.active {
      background: rgba(212,180,131,.12); color: #fff;
    }
    .r-menu a svg {
      width: 18px; height: 18px; stroke: currentColor; fill: none;
      stroke-width: 1.7; flex-shrink: 0;
    }
    .r-menu-foot {
      margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line);
      font-size: .78rem; color: rgba(255,255,255,.45);
    }

    /* ——— Feed ——— */
    .reels-shell { position: fixed; inset: 0; background: #000; }
    .reels-feed {
      height: 100%; width: 100%;
      overflow-y: scroll; scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      scrollbar-width: none;
    }
    .reels-feed::-webkit-scrollbar { display: none; }

    .reel-slide {
      height: 100%; width: 100%;
      scroll-snap-align: start; scroll-snap-stop: always;
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: #050505;
    }
    .reel-slide video, .reel-slide img {
      width: 100%; height: 100%; object-fit: cover; background: #000;
      animation: reelIn .55s var(--ease);
    }
    @keyframes reelIn {
      from { opacity: .3; transform: scale(1.05); }
      to { opacity: 1; transform: scale(1); }
    }
    .reel-grad {
      position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.4) 26%, transparent 48%),
        linear-gradient(to bottom, rgba(0,0,0,.65) 0%, transparent 20%);
    }

    /* Actions */
    .reel-actions {
      position: absolute; right: 12px;
      bottom: max(130px, calc(16% + env(safe-area-inset-bottom)));
      z-index: 8; display: flex; flex-direction: column; gap: 18px; align-items: center;
    }
    .act { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .act button {
      width: 50px; height: 50px; border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--glass);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 28px rgba(0,0,0,.4);
      transition: transform .18s var(--ease), background .2s, color .2s, border-color .2s;
    }
    .act button:active { transform: scale(.9); }
    .act button svg { width: 22px; height: 22px; fill: currentColor; }
    .act button.liked {
      color: var(--accent-hot);
      background: rgba(255,59,107,.2);
      border-color: rgba(255,59,107,.45);
    }
    .act button.saved {
      color: var(--accent);
      background: rgba(212,180,131,.18);
      border-color: rgba(212,180,131,.4);
    }
    .act span {
      font-size: .7rem; font-weight: 600; color: rgba(255,255,255,.92);
      text-shadow: 0 1px 6px #000; min-height: 14px;
    }

    /* Meta */
    .reel-meta {
      position: absolute; left: 18px; right: 78px;
      bottom: max(32px, calc(env(safe-area-inset-bottom) + 12px));
      z-index: 8; color: #fff;
    }
    .reel-studio {
      display: inline-flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }
    .reel-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(145deg, var(--accent), #8a6a3a);
      display: flex; align-items: center; justify-content: center;
      font-family: "Cormorant Garamond", serif;
      font-size: 1rem; font-weight: 600; color: #1a140c;
      border: 1.5px solid rgba(255,255,255,.4);
      box-shadow: 0 4px 16px rgba(0,0,0,.35);
    }
    .reel-studio strong { font-size: .9rem; font-weight: 600; letter-spacing: .01em; }
    .reel-meta h2 {
      margin: 0 0 8px; font-size: 1.08rem; font-weight: 600;
      text-shadow: 0 2px 14px rgba(0,0,0,.85); line-height: 1.25;
    }
    .reel-meta p {
      margin: 0; font-size: .88rem; line-height: 1.5;
      color: rgba(255,255,255,.9);
      text-shadow: 0 1px 10px rgba(0,0,0,.75);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden; max-width: 94%;
    }
    .reel-tag {
      display: inline-block; margin-top: 10px;
      font-size: .65rem; letter-spacing: .16em; text-transform: uppercase;
      color: var(--accent); font-weight: 700;
    }

    .heart-burst {
      position: absolute; left: 50%; top: 42%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 92px; color: var(--accent-hot); z-index: 20;
      pointer-events: none; opacity: 0;
      text-shadow: 0 10px 40px rgba(0,0,0,.5);
    }
    .heart-burst.pop { animation: heartPop .75s var(--ease) forwards; }
    @keyframes heartPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.15); }
      40% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -58%) scale(1); }
    }

    .reel-loader, .empty-reels {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #9c978c; text-align: center; padding: 40px 28px; gap: 14px;
    }
    .spinner {
      width: 42px; height: 42px;
      border: 2px solid rgba(255,255,255,.1);
      border-top-color: var(--accent);
      border-radius: 50%; animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-reels h3 {
      margin: 0; font-family: "Cormorant Garamond", serif;
      font-size: 1.75rem; font-weight: 500; color: #f5f1ea;
    }
    .empty-reels p { margin: 0; max-width: 280px; line-height: 1.55; font-size: .92rem; }
    .empty-reels a {
      margin-top: 10px; padding: 13px 26px; border-radius: 999px;
      background: linear-gradient(145deg, var(--accent), #b8956a);
      color: #14110d; font-weight: 600; font-size: .88rem;
      box-shadow: 0 10px 32px rgba(212,180,131,.25);
    }

    /* Comments */
    .comments {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 55;
      max-height: 58vh; background: #121214;
      border-radius: 24px 24px 0 0; border-top: 1px solid var(--line);
      transform: translateY(110%); transition: transform .38s var(--ease);
      display: flex; flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .comments.open { transform: translateY(0); }
    .comments-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--line);
    }
    .comments-head h3 { margin: 0; font-size: 1rem; font-weight: 600; }
    .comments-head button {
      border: none; background: transparent; color: #aaa; font-size: 1.4rem; cursor: pointer;
    }
    .comment-list { flex: 1; overflow-y: auto; padding: 14px 20px; font-size: .9rem; }
    .comment-list .u { color: var(--accent); font-weight: 600; font-size: .82rem; }
    .comment-list p { margin: 0 0 14px; color: #ddd; line-height: 1.45; }
    .comment-form {
      display: flex; gap: 8px; padding: 12px 16px;
      border-top: 1px solid var(--line);
    }
    .comment-form input {
      flex: 1; border-radius: 999px; border: 1px solid var(--line);
      background: #1a1a1c; color: #fff; padding: 12px 16px; font-size: .9rem; outline: none;
    }
    .comment-form input:focus { border-color: var(--accent); }
    .comment-form button {
      border: none; border-radius: 999px; padding: 0 18px;
      background: var(--accent); color: #14110d; font-weight: 600; cursor: pointer;
    }

    @media (min-width: 900px) {
      .reels-shell, .r-top {
        max-width: 430px; left: 50%; right: auto;
        transform: translateX(-50%);
      }
      .reels-shell {
        border-left: 1px solid #1a1a1a;
        border-right: 1px solid #1a1a1a;
      }
    }
  </style>
</head>
<body class="reels-mode" data-page="reels">
  <header class="r-top">
    <a class="r-brand" href="/">Artist's <span>Studio</span></a>
    <div class="r-top-actions">
      <a class="r-icon-btn" href="/portfolio.html" title="Portfolio" aria-label="Portfolio">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>
      </a>
      <button type="button" class="r-icon-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="sideMenu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <div class="r-scrim" id="menuScrim"></div>
  <aside class="r-menu" id="sideMenu" role="dialog" aria-label="Menu">
    <div class="r-menu-head">
      <strong>Artist's <span>Studio</span></strong>
      <button type="button" class="r-icon-btn" id="menuClose" aria-label="Close menu">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <nav>
      <a href="/"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg> Home</a>
      <a href="/about.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 19.5c1.8-3.2 4.2-4.5 6.5-4.5s4.7 1.3 6.5 4.5"/></svg> About</a>
      <a href="/portfolio.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg> Portfolio</a>
      <a class="active" href="/reels.html"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="m10 8 6 4-6 4V8z"/></svg> Reels</a>
      <a href="/services.html"><svg viewBox="0 0 24 24"><path d="M12 3.5 13.8 9H19l-4 3.2 1.5 5.3L12 14.8 7.5 17.5 9 12.2 5 9h5.2L12 3.5z"/></svg> Services</a>
      <a href="/contact.html"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg> Contact</a>
    </nav>
    <div class="r-menu-foot">Swipe up for next reel · Double-tap to like</div>
  </aside>

  <div class="reels-shell">
    <div class="reels-feed" id="feed">
      <div class="reel-loader"><div class="spinner"></div><p>Loading reels…</p></div>
    </div>
  </div>

  <div class="comments" id="comments">
    <div class="comments-head">
      <h3>Comments</h3>
      <button type="button" id="closeComments" aria-label="Close">×</button>
    </div>
    <div class="comment-list" id="commentList"></div>
    <form class="comment-form" id="commentForm">
      <input name="body" placeholder="Add a comment…" maxlength="500" autocomplete="off"/>
      <button type="submit">Post</button>
    </form>
  </div>

  <script>
    (function () {
      const btn = document.getElementById('menuBtn');
      const close = document.getElementById('menuClose');
      const menu = document.getElementById('sideMenu');
      const scrim = document.getElementById('menuScrim');
      function setOpen(open) {
        menu.classList.toggle('open', open);
        scrim.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        document.body.style.overflow = open ? 'hidden' : '';
      }
      btn.addEventListener('click', () => setOpen(!menu.classList.contains('open')));
      close.addEventListener('click', () => setOpen(false));
      scrim.addEventListener('click', () => setOpen(false));
      menu.querySelectorAll('a').forEach((a) => a.addEventListener('click', () => setOpen(false)));
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
    })();
  </script>
  <script src="/js/api-client.js"></script>
  <script src="/js/reels-feed.js"></script>
</body>
</html>
