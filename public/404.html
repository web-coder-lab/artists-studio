<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#0a0a0b"/>
  <title>Page not found — Artist's Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0a0a0b;--text:#f4f1ea;--muted:#9c978c;--accent:#c4a574;--line:rgba(255,255,255,.08)}
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:var(--bg);color:var(--text);
      font-family:"DM Sans",system-ui,sans-serif;
      padding:24px;text-align:center;
    }
    .code{
      font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;
      font-size:clamp(4rem,18vw,7rem);line-height:1;color:var(--accent);
      letter-spacing:.04em;margin:0 0 8px;
    }
    h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:1.75rem;margin:0 0 12px}
    p{color:var(--muted);max-width:360px;margin:0 auto 28px;line-height:1.55;font-size:.95rem}
    .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    a{
      display:inline-flex;align-items:center;justify-content:center;
      padding:12px 20px;border-radius:999px;text-decoration:none;font-size:.9rem;
      transition:opacity .15s;
    }
    a.primary{background:var(--accent);color:#14110d}
    a.ghost{border:1px solid var(--line);color:var(--text)}
    a:hover{opacity:.9}
    .brand{position:fixed;top:20px;left:20px;color:var(--muted);font-size:.85rem;text-decoration:none;letter-spacing:.04em}
  </style>
</head>
<body>
  <a class="brand" href="/">Artist's Studio</a>
  <p class="code">404</p>
  <h1>This page doesn’t exist</h1>
  <p>The path you opened isn’t part of the studio. It may have been moved, or the link is incomplete.</p>
  <div class="actions">
    <a class="primary" href="/">Back home</a>
    <a class="ghost" href="/contact.html">Contact</a>
  </div>
</body>
</html>
