<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
  <meta name="theme-color" content="#0a0a0b"/>
  <title>Contact — Artist's Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/studio.css"/>
  <link rel="stylesheet" href="/css/chat.css"/>
</head>
<body data-page="contact">
  <div class="grain" aria-hidden="true"></div>
  <div id="site-nav"></div>
  <main style="padding:12px 12px 28px">
    <div id="gate" class="page-hero" style="text-align:center;max-width:420px;margin:0 auto">
      <p class="eyebrow">Contact</p>
      <h1>Talk to the studio</h1>
      <p class="lede">Sign in for private chat — or reach out on your preferred channel.</p>
      <button type="button" class="btn" data-open="login">Sign in</button>
      <button type="button" class="btn btn-ghost" data-open="register">Join</button>
      <div id="guestChannels" style="margin-top:28px"></div>
    </div>
    <div id="chatRoot" class="hidden"></div>
  </main>
  <div id="site-foot"></div>
  <div id="site-modals"></div>
  <script src="/js/api-client.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/chat-user.js"></script>
</body>
</html>
