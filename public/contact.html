<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#070708"/>
  <title>Contact — Artist's Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/studio.css"/>
</head>
<body data-page="contact">
  <div class="grain" aria-hidden="true"></div>
  <div id="site-nav"></div>
  <main class="wrap" style="max-width:480px">
    <p class="eyebrow" id="cEyebrow">Connect</p>
    <h1 id="cTitle" style="font-family:Cormorant Garamond,serif;font-weight:500;font-size:clamp(2rem,5vw,2.6rem);margin:10px 0 12px">Get in touch</h1>
    <p class="muted" id="cSub" style="margin:0 0 28px;line-height:1.65">Reach the studio on WhatsApp, Instagram, or email. No account required.</p>
    <div id="channels" class="channel-grid"><p class="muted">Loading…</p></div>
  </main>
  <div id="site-foot"></div>
  <div id="site-modals"></div>
  <script src="/js/api-client.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      try {
        const d = await fetch('/api/v1/site').then(r => r.json());
        const c = (d.site && d.site.copy && d.site.copy.contact) || {};
        if (c.eyebrow) document.getElementById('cEyebrow').textContent = c.eyebrow;
        if (c.title) document.getElementById('cTitle').textContent = c.title;
        if (c.subtitle) document.getElementById('cSub').textContent = c.subtitle;
      } catch (_) {}
      const root = document.getElementById('channels');
      try {
        const data = await (window.StudioAPI ? StudioAPI.api('/socials') : fetch('/api/v1/socials').then(r => r.json()));
        const s = data.socials || {};
        const wa = String(s.whatsapp || '').replace(/\D/g, '');
        const email = s.email || '';
        const ig = s.instagram || '';
        const cards = [];
        if (wa) cards.push(`<a class="channel-card" href="https://wa.me/${wa}" target="_blank" rel="noopener"><span class="channel-ico">WHATSAPP</span><span class="channel-label">WhatsApp</span><span class="channel-sub">Message the studio</span></a>`);
        if (ig) cards.push(`<a class="channel-card" href="${ig.replace(/"/g,'')}" target="_blank" rel="noopener"><span class="channel-ico">INSTAGRAM</span><span class="channel-label">Instagram</span><span class="channel-sub">Open profile</span></a>`);
        if (email) cards.push(`<a class="channel-card" href="mailto:${email.replace(/"/g,'')}"><span class="channel-ico">EMAIL</span><span class="channel-label">Gmail</span><span class="channel-sub">${email.replace(/</g,'')}</span></a>`);
        root.innerHTML = cards.length ? cards.join('') : '<p class="muted">Channels coming soon.</p>';
      } catch (e) {
        root.innerHTML = '<p class="muted">Could not load channels.</p>';
      }
    })();
  </script>
</body>
</html>
