<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>

    <div id="chatRoot" class="hidden"></div>

  <div id="site-foot"></div>
