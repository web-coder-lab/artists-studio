name: Build Admin APK

on:
  push:
    branches: [main]
    paths:
      - 'android-admin/**'
      - '.github/workflows/build-admin-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.2.1
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.2.1-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2.1/bin" >> $GITHUB_PATH

      - name: local.properties
        working-directory: android-admin
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Debug keystore for CI signing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble Release
        working-directory: android-admin
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

      - name: List outputs
        run: find android-admin/app/build/outputs -type f -name "*.apk" -ls || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudioAdmin-APK
          path: android-admin/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-apk-v1.0.3
          name: Studio Admin APK v1.0.3
          body: |
            **Artist's Studio Admin** (no login)
            - X-Admin-Key auth
            - Dashboard, Media, Studio CMS, Analytics, Publish, Security
            - Domain: https://artists-studio.onrender.com
          files: |
            android-admin/app/build/outputs/apk/release/app-release-unsigned.apk
            android-admin/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
