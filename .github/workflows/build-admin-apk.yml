name: Build Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-admin/**'
      - '.github/workflows/build-admin-apk.yml'
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Gradle wrapper
        working-directory: android-admin
        run: |
          if [ ! -f gradlew ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.2.1-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.2.1/bin/gradle wrapper --gradle-version 8.2.1
          fi
          chmod +x gradlew

      - name: Assemble debug APK
        working-directory: android-admin
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          APK=$(ls android-admin/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" dist/StudioAdmin-2.0.0.apk
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: StudioAdmin-apk
          path: dist/StudioAdmin-2.0.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-apk-v2.0.0
          name: Studio Admin APK v2.0.0
          body: |
            Artist's Studio **Admin** Android app (final)
            - Full remote text & design control
            - Photo / reel upload + delete
            - Analytics (views, likes, comments, shares)
            - Socials, publish, security
            - API only — no WebView

            Login: admin / (see Password login on GitHub DB)
          files: dist/StudioAdmin-2.0.0.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
