name: Build Admin APK
on:
  push:
    paths:
      - 'android-admin/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.2 || true
          chmod +x gradlew || true
      - name: Assemble
        run: |
          if [ -f ./gradlew ]; then ./gradlew :app:assembleDebug --no-daemon; else echo "Add gradle wrapper locally"; fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: studio-admin-debug
          path: android-admin/app/build/outputs/apk/debug/*.apk
