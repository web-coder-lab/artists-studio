name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-admin/**'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2.1 || true
          if [ ! -f gradlew ]; then
            curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradlew -o gradlew
            chmod +x gradlew
          fi
      - name: Assemble Debug APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew :app:assembleDebug --no-daemon
        working-directory: ${{ github.workspace }}/android-admin
      - uses: actions/upload-artifact@v4
        with:
          name: studio-admin-debug-apk
          path: android-admin/app/build/outputs/apk/debug/*.apk
